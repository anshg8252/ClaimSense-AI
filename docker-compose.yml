# ClaimSense AI — Production Multi-Container Compose Configuration
# Milestone: Phase 12 Asynchronous Task Queue & Scalable Micro-Worker Architecture

version: "3.8"

services:
  redis:
    image: redis:7-alpine
    container_name: claimsense-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - claimsense_redis:/data
    expose:
      - "6379"
    networks:
      - claimsense-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: claimsense-app
    restart: unless-stopped
    environment:
      - FLASK_ENV=production
      - FLASK_DEBUG=0
      - HOST=0.0.0.0
      - PORT=5001
      - SQLITE_WAL_MODE=true
      - JSON_LOGGING=true
      - SECRET_KEY=${SECRET_KEY:?SECRET_KEY must be set in environment or .env}
      - DATABASE_PATH=${DATABASE_PATH:-/app/data/claimsense.db}
      - UPLOAD_FOLDER=${UPLOAD_FOLDER:-/app/uploads}
      - REPORTS_FOLDER=${REPORTS_FOLDER:-/app/reports}
      - CORS_ALLOWED_ORIGINS=http://localhost,http://127.0.0.1,http://localhost:5001
      - REDIS_URL=redis://redis:6379/0
      - QUEUE_BROKER_TYPE=redis
      - ASYNC_PROCESSING_ENABLED=true
    volumes:
      - claimsense_data:/app/data
      - claimsense_uploads:/app/uploads
      - claimsense_reports:/app/reports
      - claimsense_backups:/app/backups
    expose:
      - "5001"
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - claimsense-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:5001/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: claimsense-worker
    restart: unless-stopped
    command: ["python", "scripts/run_worker.py", "--broker", "redis"]
    environment:
      - FLASK_ENV=production
      - SECRET_KEY=${SECRET_KEY:?SECRET_KEY must be set in environment or .env}
      - DATABASE_PATH=${DATABASE_PATH:-/app/data/claimsense.db}
      - UPLOAD_FOLDER=${UPLOAD_FOLDER:-/app/uploads}
      - REPORTS_FOLDER=${REPORTS_FOLDER:-/app/reports}
      - REDIS_URL=redis://redis:6379/0
      - QUEUE_BROKER_TYPE=redis
      - ASYNC_PROCESSING_ENABLED=true
      - SQLITE_WAL_MODE=true
      - JSON_LOGGING=true
    volumes:
      - claimsense_data:/app/data
      - claimsense_uploads:/app/uploads
      - claimsense_reports:/app/reports
      - claimsense_backups:/app/backups
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - claimsense-net

  nginx:
    image: nginx:1.25-alpine
    container_name: claimsense-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./deploy/nginx/conf.d:/etc/nginx/conf.d:ro
      - ./frontend:/usr/share/nginx/html:ro
      - claimsense_reports:/app/reports:ro
    depends_on:
      app:
        condition: service_healthy
    networks:
      - claimsense-net

volumes:
  claimsense_data:
    driver: local
  claimsense_uploads:
    driver: local
  claimsense_reports:
    driver: local
  claimsense_backups:
    driver: local
  claimsense_redis:
    driver: local

networks:
  claimsense-net:
    driver: bridge
